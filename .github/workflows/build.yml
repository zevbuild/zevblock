name: Build & Release ZevBlock APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Generate Debug Keystore
        run: |
          echo "Setting up debug keystore for APK signing..."
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64"
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore with keytool"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Setup Environment Files
        run: |
          # Secrets Gradle Plugin requires .env to exist
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare Gradle Wrapper
        run: |
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Package APK for Distribution
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK generated by Gradle build"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          TAG_NAME="${GITHUB_REF_NAME:-v2.5}"
          SAFE_TAG=$(echo "$TAG_NAME" | tr '/' '-')
          cp "$APK_FILE" "dist/ZevBlock-${SAFE_TAG}.apk"
          cp "$APK_FILE" dist/ZevBlock-v2.5.apk
          cp "$APK_FILE" dist/ZevBlock-latest.apk
          ls -la dist/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZevBlock-v2.5-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
          name: ZevBlock ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
